<style>
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#1B2430; --ink-2:#4A5568; --ink-3:#7B8794;
  --line:#D9E0E8; --navy:#1F3A5F; --navy-soft:#E4EBF4; --green:#1B7F3B; --green-soft:#E3F3E8;

}

}

  --line:#2E3946; --navy:#9DBBE0; --navy-soft:#26354A; --green:#5FC97F; --green-soft:#1C3A28;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:820px;margin:0 auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;line-height:1.1;color:var(--navy);text-wrap:balance}
.brand .sub{color:var(--ink-3);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.ghost{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.ghost{color:var(--ink-2)}
.score{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.bar{height:6px;background:var(--navy-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:.02em;background:var(--navy-soft);color:var(--navy)}
.stem{font-size:19px;line-height:1.4;margin:0;max-width:68ch}
.fig{max-width:620px}.fig svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--navy)}
.opts button:disabled{cursor:default}
.opts .l{font-weight:600;color:var(--ink-3);min-width:1.2em}
.opts button.correct{border-color:var(--green);background:var(--green-soft)}
.opts button.correct .l,.opts button.correct .t{color:var(--green);font-weight:600}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button.wrong .l,.opts button.wrong .t{color:var(--red)}
.verdict{font-weight:700}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.expl{font-size:14px;color:var(--ink-2);font-style:italic;margin:0;max-width:75ch}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--paper);cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.pos{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
button:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:520px){.card{padding:16px}.stem{font-size:17px}.nav button{padding:9px 12px}}

<script>
const Q = [{"id": "Q1B-005", "lecture": "L1", "stem": "Under the Chatham House Rule, which governs our class discussions and guest speakers, participants:", "opts": ["may neither use nor repeat anything said in the room", "may share both the information and the speaker's name as long as the meeting was announced publicly", "may use the information only with the speaker's written permission", "may use the information they receive but may not reveal the identity or affiliation of the speaker"], "correct": 3, "expl": "L1 'The Chatham House Rule': take the idea with you, leave the name in the room."}, {"id": "Q1B-006", "lecture": "L2", "stem": "The market environment of a firm is best described as:", "opts": ["the firm's interactions with suppliers and customers, governed by markets and contracts", "the firm's social, political, and legal arrangements that structure interactions outside of contracts", "the set of government regulations with which the firm must comply", "the activist groups and news media that scrutinize the firm"], "correct": 0, "expl": "L2 'What's the market environment?': suppliers and customers, markets and contracts, voluntary, mutually beneficial exchange."}, {"id": "Q1B-007", "lecture": "L2", "stem": "Which of the following is part of a firm's *nonmarket* environment?", "opts": ["setting the retail price of a new product line", "a state bill that would cap the prices the firm may charge", "hiring a new manager for the firm's largest plant", "negotiating a volume discount with a key supplier"], "correct": 1, "expl": "L2: the nonmarket environment covers social, political, and legal arrangements outside markets and contracts; regulation is an involuntary nonmarket interaction."}, {"id": "Q1B-008", "lecture": "L2", "stem": "Which of the following is an example of a *voluntary* nonmarket interaction?", "opts": ["a consumer boycott of the firm's products", "a government agency fining the firm for emissions violations", "a protest outside the firm's headquarters", "a firm obtaining an environmental certification for its products"], "correct": 3, "expl": "L2 'What's the nonmarket environment?': voluntary examples are CSR and environmental certification; regulation, boycotts, and protests are involuntary."}, {"id": "Q1B-009", "lecture": "L2", "stem": "Microsoft in the late 1990s, Walmart in the 2000s, and \"Big Tech\" today all attracted intense nonmarket scrutiny. Which of the following is a reason why we observed these patterns?", "opts": ["they have weaker legal departments than smaller firms", "they have fewer customers and therefore less political support", "they grew big enough to attract attention from activists and regulators", "they are exempt from most regulation and therefore attract legislative attention"], "correct": 2, "expl": "L2 'Interactions between the environments': scrutiny varies with market position; leaders are appealing targets for activists and threatened competitors."}, {"id": "Q1B-010", "lecture": "L2", "stem": "Which of the following best illustrates information from the *market* environment shaping a firm's *nonmarket* strategy?", "opts": ["engineers' cost estimates for raising fuel economy shape an automaker's stance on new mileage rules", "control of the Senate changes after an election, shifting the automaker's lobbying targets", "a labor union organizes workers at a competitor's plant, raising that rival's labor costs", "a court rules on a patent dispute between two rivals, changing their relative market shares"], "correct": 0, "expl": "L2 'Interactions between the environments': cost estimates from engineers on fuel economy; profit disclosures shaping antitrust perceptions."}, {"id": "Q1B-011", "lecture": "L2", "stem": "Which of the following is **not** one of the four Is of the nonmarket environment?", "opts": ["Information", "Interests", "Incentives", "Issues"], "correct": 2, "expl": "L2 'The four Is': Issues, Interests, Institutions, Information."}, {"id": "Q1B-012", "lecture": "L2", "stem": "In the 4Is framework, the fundamental unit of analysis, around which nonmarket recommendations are typically built, is the:", "opts": ["interest", "issue", "institution", "piece of information"], "correct": 1, "expl": "L2 'Issues': a matter in dispute; the fundamental unit of analysis; recommendations are issue specific."}, {"id": "Q1B-013", "lecture": "L2", "stem": "The Exxon Valdez oil spill made environmental policy far more salient to the public and led to changes in regulation and liability assessments. This illustrates that:", "opts": ["information about costs and benefits is always objective", "issues are defined only by legislatures", "interests never change their beliefs", "the importance of an issue changes over time in response to events"], "correct": 3, "expl": "L2 'Issues': issue importance changes over time in response to events (Exxon Valdez example)."}, {"id": "Q1B-014", "lecture": "L2", "stem": "Which statement about *interests* in the 4Is framework is correct?", "opts": ["an interest must be formally organized in order to count as an interest", "an interest's preferences are fixed once an issue emerges", "an interest's stake in an issue may be financial or non-financial", "only firms and trade associations count as interests"], "correct": 2, "expl": "L2 'Interests': individuals and groups with preferences or a stake; the stake can be financial or non-financial; preferences and beliefs may evolve."}, {"id": "Q1B-015", "lecture": "L2", "stem": "The shift in some environmentalists' beliefs about the safety of nuclear power illustrates that:", "opts": ["institutions have diverse interests", "information cannot be strategically withheld", "the preferences and beliefs of interests may evolve over time", "every issue passes through the same five life-cycle stages"], "correct": 2, "expl": "L2 'Interests': preferences and beliefs may evolve over time (nuclear power example)."}, {"id": "Q1B-017", "lecture": "L2", "stem": "Congress is considering a new tariff on imported steel. Which interest is most likely to be well organized in the debate?", "opts": ["the domestic steel producers' trade association", "taxpayers in general", "the general public", "households that buy products containing steel"], "correct": 0, "expl": "L2 'Organized vs unorganized interests': concentrated, common-interest groups organize; diffuse groups face collective action problems."}, {"id": "Q1B-018", "lecture": "L2", "stem": "In the 4Is framework, *institutions* are:", "opts": ["the facts, beliefs, and projections about the costs and benefits of an action", "the political, legal, or social settings in which nonmarket issues play out", "the news outlets that cover a nonmarket issue", "the individuals and groups with a stake in an issue"], "correct": 1, "expl": "L2 'Institutions': political, legal, or social setting where issues play out; formality and rules vary; institutions have diverse interests."}, {"id": "Q1B-019", "lecture": "L2", "stem": "In the 4Is framework, *information* refers to:", "opts": ["the formal rules a legislature uses to reach its decisions", "the number and organization of the interests engaged on an issue", "facts, beliefs, and projections about the costs and benefits of actions", "the position the news media takes when it covers an issue"], "correct": 2, "expl": "L2 'Information': facts, beliefs, and projections about costs and benefits; determines stakes; affects preferences; can be strategically deployed or withheld."}, {"id": "Q1B-021", "lecture": "L2", "stem": "An automaker's internal forecast of consumer demand for electric vehicles shapes its position on emissions rules. This illustrates that:", "opts": ["information affects the preferences of interests", "issues are always financial", "institutions determine what information exists", "interests are rarely organized"], "correct": 0, "expl": "L2 'Information': information affects preferences of interests (EV demand forecast example)."}, {"id": "Q1B-022", "lecture": "L2", "stem": "A pharmaceutical company's estimate that a proposed price cap would cut its R&D spending by 30 percent is best classified as which of the four Is?", "opts": ["Institution", "Information", "Interest", "Issue"], "correct": 1, "expl": "L2: a projection about the costs of a policy is information; the price cap is the issue; the company is an interest."}, {"id": "Q1B-024", "lecture": "L2", "stem": "A federal agency is writing the detailed rules needed to implement a statute Congress passed last year. Which stage of the issue life cycle does this represent?", "opts": ["issue identification", "interest group formation", "legislation", "administration"], "correct": 3, "expl": "L2 'Issue life cycle': administration is the stage after legislation, when agencies implement the law; enforcement follows."}, {"id": "Q1B-026", "lecture": "L3", "stem": "Which statement best describes federalism in the United States?", "opts": ["local governments have no independent authority of their own", "all policy authority rests with the federal government, which delegates tasks to the states", "state governments must use the same procedures as the federal government to select officeholders", "power is divided among federal, state, and local governments, and some major policies such as Medicaid are jointly administered"], "correct": 3, "expl": "L3 'Federalism': power divided among federal, state, and local governments; states have their own procedures; Medicaid jointly administered."}, {"id": "Q1B-027", "lecture": "L3", "stem": "Which of the following powers belongs to the *federal* government rather than the states?", "opts": ["establishing local governments", "regulating interstate and foreign commerce", "conducting elections", "regulating intrastate commerce"], "correct": 1, "expl": "L3 'State vs. Federal': federal powers include coining money, regulating interstate and foreign commerce, declaring war; states conduct elections and regulate intrastate commerce."}, {"id": "Q1B-028", "lecture": "L3", "stem": "Which statement about U.S. presidential elections is correct?", "opts": ["every state awards its electors by congressional district, so each district is decided separately", "a candidate must win a majority of the popular vote in at least 26 states in order to be elected", "the candidate with the most popular votes nationwide becomes president regardless of the electors", "a candidate needs 270 of 538 electoral votes, and most states award all their electors to the plurality winner"], "correct": 3, "expl": "L3 'Executive branch': winner-take-all by plurality in most states (Maine and Nebraska partially allocate by district); 270 of 538 needed."}, {"id": "Q1B-033", "lecture": "L3", "stem": "Which statement about the U.S. House of Representatives is correct?", "opts": ["its members must live in the district they represent and be at least 30 years old", "it has 435 members elected from single-member districts to two-year terms", "its members serve six-year terms, with one-third of them elected every two years", "it has 100 voting members, two from each state regardless of population"], "correct": 1, "expl": "L3 'House of Representatives': 435 members, single-member districts, two-year terms; at least 25 years old, seven years a citizen, inhabitant of the state (not necessarily the district)."}, {"id": "Q1B-034", "lecture": "L3", "stem": "Which statement about the U.S. Senate is correct?", "opts": ["its members serve two-year terms and must be at least 25 years old when elected", "its seats are apportioned to the states by population, with at least one per state", "it has 100 members, two per state, serving six-year terms with one-third elected every two years", "all of its members run for reelection at the same time, once every six years"], "correct": 2, "expl": "L3 'Senate': 100 members, two per state, six-year terms, roughly 1/3 elected every two years; at least 30 years old and nine years a citizen."}, {"id": "Q1B-035", "lecture": "L3", "stem": "For a bill to become federal law:", "opts": ["it must pass both chambers, and a presidential veto can be overridden by two-thirds of each chamber", "a presidential veto can be overridden by a three-fifths vote in the Senate alone", "it needs a majority in either chamber, after which the president must sign it within ten days", "the president's signature is not required if the bill passed both chambers by a simple majority"], "correct": 0, "expl": "L3 'Lawmaking': passed by both chambers; veto overridden by 2/3 of each chamber."}, {"id": "Q1B-036", "lecture": "L3", "stem": "A House committee refuses to report a bill to the floor. Which mechanism allows the bill to be considered anyway?", "opts": ["an executive order from the president releasing the bill", "a request from the Senate Rules Committee to reassign the bill", "a motion by the minority leader to bypass the committee", "a discharge petition signed by a majority (218) of House members"], "correct": 3, "expl": "L3/L4 'Committees and gatekeeping authority in the House': discharge petition (218 signatures) lets the floor consider a bill without a committee report; used increasingly in the 119th Congress."}, {"id": "Q1B-037", "lecture": "L3", "stem": "Under a *closed* rule issued by the House Rules Committee:", "opts": ["no floor amendments are permitted except those from the reporting committee", "the bill is automatically returned to the committee that reported it", "amendments are limited to a set number and to specified subjects", "any member may offer amendments on the floor without giving prior notice"], "correct": 0, "expl": "L3 'Committees and gatekeeping': closed rules bar floor amendments (except from the reporting committee); structured rules restrict number and content; open rules allow amendments (rare)."}, {"id": "Q1B-038", "lecture": "L3", "stem": "Under current Senate practice, most legislation cannot advance unless:", "opts": ["the House has already passed the bill", "two-thirds of senators vote to end debate", "a simple majority of senators votes to end debate", "60 senators are willing to vote to end debate"], "correct": 3, "expl": "L3 'Deliberations in the Senate': a member can speak indefinitely (filibuster) unless 60 senators impose cloture."}, {"id": "Q1B-039", "lecture": "L3", "stem": "Which statement about the Senate reconciliation process is correct?", "opts": ["each budget resolution can generate an unlimited number of reconciliation bills", "legislation can pass with a simple majority of senators", "reconciliation bills require 60 votes like most other legislation", "the Byrd rule bars any provision that increases the deficit within the ten-year window"], "correct": 1, "expl": "L3 'Senate reconciliations': majority vote; Byrd rule bars deficit increases beyond the window (typically 10 years); at most three bills per resolution; examples: 2022 IRA, 2025 reconciliation package."}, {"id": "Q1B-040", "lecture": "L3", "stem": "Which of the following is a reason why legislatures restrict which members can bring proposals to the floor?", "opts": ["to ensure that every member has exactly equal power", "the Constitution requires that only committee chairs introduce legislation", "to prevent the president from vetoing bills", "plenary time is fixed, so unrestricted proposals would make obstruction easy and lawmaking chaotic"], "correct": 3, "expl": "L3 'Legislative Organization': every legislator has one vote but power is not uniform; fixed plenary time means floor access must be restricted."}, {"id": "Q1B-041", "lecture": "L4", "stem": "The news media functions in the nonmarket environment mainly as:", "opts": ["a funder of interest groups", "an intermediary that alerts the public and informs government officials", "a regulator that enforces disclosure requirements on firms", "an institution that drafts and votes on legislation"], "correct": 1, "expl": "L4 'News media': the 'fourth branch'; in most cases an intermediary; critical for issue identification."}, {"id": "Q1B-042", "lecture": "L4", "stem": "A newspaper editorial urging Congress to pass a specific bill is an example of which form of media treatment of an issue?", "opts": ["presentation", "interpretation", "exploration of ramifications", "advocacy"], "correct": 3, "expl": "L4 'Issues and media coverage': treatment can be presentation of facts, interpretation, exploration of ramifications, or advocacy."}, {"id": "Q1B-044", "lecture": "L4", "stem": "The \"societal significance\" factor in media coverage reflects:", "opts": ["the profit motive of media owners and their advertisers", "the media's self-defined duty to inform the public", "journalists' individual career concerns and ambitions", "audiences' preference for stories close to their own experience"], "correct": 1, "expl": "L4 'Factors affecting media coverage': societal significance = self-defined duty to inform; constitutional role supporting democracy."}, {"id": "Q1B-045", "lecture": "L4", "stem": "Gentzkow and Shapiro (2010) found that news consumers:", "opts": ["prefer news that aligns with their own ideological views", "prefer news that challenges their ideological views", "are indifferent to the ideological slant of news", "consume only local news"], "correct": 0, "expl": "L4 'Media and electoral influence': consumers prefer news aligned with their ideological interests."}, {"id": "Q1B-046", "lecture": "L4", "stem": "A media outlet wants to influence an election. Adopting a more extreme ideological slant:", "opts": ["reduces its influence over its readers but raises turnout among its core audience", "raises its influence over its readers but shrinks its reach among persuadable moderates", "has no effect on who reads the outlet or on how those readers vote", "raises both its influence over its readers and its reach among persuadable moderates"], "correct": 1, "expl": "L4 'Media and electoral influence': the slant trade-off between influence on readers and reach among persuadable moderates."}, {"id": "Q1B-047", "lecture": "L4", "stem": "Li and Martin (2026) found that a one-standard-deviation increase in Fox News exposure:", "opts": ["raised Tea Party candidates' campaign fundraising but did not increase rally sizes", "had no measurable effect on Tea Party candidates", "increased Tea Party rally sizes but had no effect on fundraising", "reduced Republican primary turnout"], "correct": 0, "expl": "L4 'How Fox News Built the Tea Party': +14.3% fundraising, +2.1 percentage points primary vote share, no effect on rally sizes."}, {"id": "Q1B-048", "lecture": "L4", "stem": "Prat and Stromberg (2013) argue that competition among media outlets constrains media slant because:", "opts": ["advertisers refuse to buy space in outlets that they perceive as slanted", "government regulators penalize outlets whose coverage is found to be biased", "outlets maximize revenue by catering to what their consumers want to read", "journalists are required to disclose their political views to their readers"], "correct": 2, "expl": "L4 'Profits to the rescue?': profit concerns constrain slant; fragmentation can limit ideological outlets' influence."}, {"id": "Q1B-049", "lecture": "L4", "stem": "Which of the following is a *caveat* to the argument that market competition disciplines media bias?", "opts": ["outlets have no financial incentive to attract or retain readers", "consumers switch outlets at the first sign of bias in their coverage", "media alternatives are abundant and easy for consumers to find", "people tend to underestimate the slant in the news they regularly consume"], "correct": 3, "expl": "L4 'Caveats': alternatives are hard to find (Noam 2016); people underestimate slant (Eyster and Rabin 2010); people stick with familiar sources."}, {"id": "Q1B-050", "lecture": "L4", "stem": "When Spain required newspapers to charge aggregators for linking to snippets and Google News shut down there (2015), Athey, Mobius, and Pal found that:", "opts": ["news consumption fell about 20 percent among Google News users", "news consumption was unchanged", "large publishers lost the most traffic", "publishers' own site views rose sharply as readers went directly to their sites"], "correct": 0, "expl": "L4 'News aggregators in the media market': aggregators acted as complements, reducing search and discovery costs."}, {"id": "Q1B-051", "lecture": "L5", "stem": "To classify an issue using the Wilson-Lowi matrix, you need to know:", "opts": ["which political party controls Congress and the White House", "how much money each side has spent on lobbying and campaign contributions", "whether the policy's benefits and its costs are each concentrated or widely distributed", "whether the issue is decided at the federal, state, or local level"], "correct": 2, "expl": "L5 'Types of political competition': who benefits and who bears the costs; many or few; per-capita benefits and costs high or low."}, {"id": "Q1B-052", "lecture": "L5", "stem": "Majoritarian politics arises when:", "opts": ["benefits are concentrated and costs are widely distributed", "benefits are widely distributed and costs are concentrated", "both the benefits and the costs of a policy are widely distributed", "both benefits and costs are concentrated on identifiable groups"], "correct": 2, "expl": "L5 'Majoritarian politics': broad public interest; change involves broad public debate and shifts in ideological beliefs; example: Social Security reform."}, {"id": "Q1B-053", "lecture": "L5", "stem": "Interest group politics is characterized by:", "opts": ["concentrated benefits and concentrated costs", "concentrated benefits and widely distributed costs", "widely distributed benefits and concentrated costs", "widely distributed benefits and costs"], "correct": 0, "expl": "L5 'Interest group politics': both sides organized; example: net neutrality (ISPs vs. Big Tech)."}, {"id": "Q1B-054", "lecture": "L5", "stem": "Client politics arises when:", "opts": ["benefits are concentrated on a specific group while costs are widely distributed", "benefits are widely distributed and costs are concentrated on a specific group", "both benefits and costs are widely distributed across the whole population", "both benefits and costs are concentrated on specific identifiable groups"], "correct": 0, "expl": "L5 'Client politics': beneficiaries organized, opposition diffuse; often supported by regulatory capture; example: agricultural subsidies."}, {"id": "Q1B-055", "lecture": "L5", "stem": "Entrepreneurial politics arises when:", "opts": ["both benefits and costs are concentrated", "benefits are widely distributed and costs are concentrated", "both benefits and costs are widely distributed", "benefits are concentrated and costs are widely distributed"], "correct": 1, "expl": "L5 'Entrepreneurial politics': needs an entrepreneur (business, politician, or activist); big role for the media; example: environmental regulation."}, {"id": "Q1B-056", "lecture": "L5", "stem": "A quota on sugar imports raises the incomes of a few hundred domestic sugar growers while slightly raising grocery prices for every consumer. Under the Wilson-Lowi matrix this is:", "opts": ["entrepreneurial politics", "interest group politics", "majoritarian politics", "client politics"], "correct": 3, "expl": "Concentrated benefits (growers) and widely distributed costs (consumers) = client politics."}, {"id": "Q1B-057", "lecture": "L5", "stem": "A proposed rule would sharply cut emissions from a handful of coal-fired power plants, improving air quality for millions of residents while imposing large compliance costs on the plants' owners. Under the Wilson-Lowi matrix this is:", "opts": ["client politics", "entrepreneurial politics", "majoritarian politics", "interest group politics"], "correct": 1, "expl": "Widely distributed benefits (residents) and concentrated costs (plant owners) = entrepreneurial politics."}, {"id": "Q1B-058", "lecture": "L5", "stem": "A proposal to raise the payroll tax rate on all workers in order to increase Social Security benefits for all retirees is best described as:", "opts": ["majoritarian politics", "client politics", "interest group politics", "entrepreneurial politics"], "correct": 0, "expl": "Both costs (all workers) and benefits (all retirees) are widely distributed = majoritarian politics."}, {"id": "Q1B-065", "lecture": "L5", "stem": "Five voters have ideal points at -4, -2, 0, 2, and 4 on a liberal-conservative scale. The Democratic candidate is at -3 and the Republican candidate is at +1. Under the median voter theorem, who wins? (See the figure.)", "opts": ["the Republican, with 3 of 5 votes (the voters at 0, 2, and 4)", "the election is tied", "the Democrat, with 3 of 5 votes (the voters at -4, -2, and 0)", "the Republican, with 4 of 5 votes"], "correct": 0, "expl": "Distances: voter at 0 is 3 from -3 and 1 from +1, so votes Republican; voters at -4 and -2 vote Democrat; voters at 2 and 4 vote Republican. Spatial voting, L5 'Median voter theorem in elections'.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 190\" width=\"720\" height=\"190\" font-family=\"Helvetica, Arial, sans-serif\" font-size=\"14\">\n<rect width=\"720\" height=\"190\" fill=\"#ffffff\"/>\n<line x1=\"30\" y1=\"110\" x2=\"690\" y2=\"110\" stroke=\"#333\" stroke-width=\"2\"/>\n<polygon points=\"22,110 32,105 32,115\" fill=\"#333\"/>\n<polygon points=\"698,110 688,105 688,115\" fill=\"#333\"/>\n<text x=\"30\" y=\"152\" fill=\"#555\" font-size=\"13\">Liberal</text>\n<text x=\"690\" y=\"152\" text-anchor=\"end\" fill=\"#555\" font-size=\"13\">Conservative</text>\n<line x1=\"120.0\" y1=\"106\" x2=\"120.0\" y2=\"114\" stroke=\"#333\"/><text x=\"120.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">-4</text>\n<line x1=\"240.0\" y1=\"106\" x2=\"240.0\" y2=\"114\" stroke=\"#333\"/><text x=\"240.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">-2</text>\n<line x1=\"360.0\" y1=\"106\" x2=\"360.0\" y2=\"114\" stroke=\"#333\"/><text x=\"360.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">0</text>\n<line x1=\"480.0\" y1=\"106\" x2=\"480.0\" y2=\"114\" stroke=\"#333\"/><text x=\"480.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">2</text>\n<line x1=\"600.0\" y1=\"106\" x2=\"600.0\" y2=\"114\" stroke=\"#333\"/><text x=\"600.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">4</text>\n<line x1=\"180.0\" y1=\"110\" x2=\"180.0\" y2=\"72\" stroke=\"#1f4ea3\" stroke-width=\"3\"/><text x=\"180.0\" y=\"64\" text-anchor=\"middle\" fill=\"#1f4ea3\" font-weight=\"bold\">Democratic candidate</text>\n<line x1=\"420.0\" y1=\"110\" x2=\"420.0\" y2=\"72\" stroke=\"#b0392c\" stroke-width=\"3\"/><text x=\"420.0\" y=\"64\" text-anchor=\"middle\" fill=\"#b0392c\" font-weight=\"bold\">Republican candidate</text>\n<circle cx=\"120.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"120.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Voter 1</text>\n<circle cx=\"240.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"240.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Voter 2</text>\n<circle cx=\"360.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"360.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Voter 3</text>\n<circle cx=\"480.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"480.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Voter 4</text>\n<circle cx=\"600.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"600.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Voter 5</text>\n</svg>"}, {"id": "Q1B-066", "lecture": "L5", "stem": "The median voter theorem predicts that in a two-candidate election where citizens vote by ideological proximity, each candidate should:", "opts": ["position as far from the opponent as possible", "converge to the ideal point of the median voter to maximize vote share", "position at the mean of all voters' ideal points", "adopt the position of their party's most committed activists"], "correct": 1, "expl": "L5 'Median voter theorem in elections': both candidates converge to the median voter's most preferred position."}, {"id": "Q1B-067", "lecture": "L5", "stem": "Primaries are one explanation for why candidates adopt non-median positions. The mechanism is that:", "opts": ["primary voters do not care about ideology, only about a candidate's experience", "candidates cannot change positions between the primary and the general election", "primaries are decided by campaign contributions rather than by votes cast", "the median primary voter is typically more extreme than the median general-election voter"], "correct": 3, "expl": "L5 'Explanations for ideological divergence': abstention, candidates caring about ideology, campaign contributions, primaries."}, {"id": "Q1B-069", "lecture": "L5", "stem": "Five legislators have ideal points at 1, 2, 3, 4, and 5. The status quo is at 1 and a proposed policy is at 3.5. Under the median voter theorem, what happens? (See the figure.)", "opts": ["the policy fails because the median legislator is at 3, not at 3.5", "the policy passes unanimously because every legislator sits above the status quo", "the policy fails 3-2; only legislators at 4 and 5 prefer it to the status quo", "the policy passes 3-2; legislators at 3, 4, and 5 prefer it to the status quo"], "correct": 3, "expl": "Legislator at 3: distance 0.5 to policy vs 2 to status quo, votes yes; at 2: 1.5 vs 1, votes no; at 1: votes no. L5 'Median voter theorem in legislatures'.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 190\" width=\"720\" height=\"190\" font-family=\"Helvetica, Arial, sans-serif\" font-size=\"14\">\n<rect width=\"720\" height=\"190\" fill=\"#ffffff\"/>\n<line x1=\"30\" y1=\"110\" x2=\"690\" y2=\"110\" stroke=\"#333\" stroke-width=\"2\"/>\n<polygon points=\"22,110 32,105 32,115\" fill=\"#333\"/>\n<polygon points=\"698,110 688,105 688,115\" fill=\"#333\"/>\n<text x=\"30\" y=\"152\" fill=\"#555\" font-size=\"13\">Liberal</text>\n<text x=\"690\" y=\"152\" text-anchor=\"end\" fill=\"#555\" font-size=\"13\">Conservative</text>\n<line x1=\"160.0\" y1=\"106\" x2=\"160.0\" y2=\"114\" stroke=\"#333\"/><text x=\"160.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">1</text>\n<line x1=\"260.0\" y1=\"106\" x2=\"260.0\" y2=\"114\" stroke=\"#333\"/><text x=\"260.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">2</text>\n<line x1=\"360.0\" y1=\"106\" x2=\"360.0\" y2=\"114\" stroke=\"#333\"/><text x=\"360.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">3</text>\n<line x1=\"460.0\" y1=\"106\" x2=\"460.0\" y2=\"114\" stroke=\"#333\"/><text x=\"460.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">4</text>\n<line x1=\"560.0\" y1=\"106\" x2=\"560.0\" y2=\"114\" stroke=\"#333\"/><text x=\"560.0\" y=\"132\" text-anchor=\"middle\" fill=\"#333\">5</text>\n<line x1=\"160.0\" y1=\"110\" x2=\"160.0\" y2=\"72\" stroke=\"#6b7280\" stroke-width=\"3\"/><text x=\"160.0\" y=\"64\" text-anchor=\"middle\" fill=\"#6b7280\" font-weight=\"bold\">Status quo</text>\n<line x1=\"410.0\" y1=\"110\" x2=\"410.0\" y2=\"72\" stroke=\"#1f4ea3\" stroke-width=\"3\"/><text x=\"410.0\" y=\"64\" text-anchor=\"middle\" fill=\"#1f4ea3\" font-weight=\"bold\">Proposed policy</text>\n<circle cx=\"160.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"160.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Leg. 1</text>\n<circle cx=\"260.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"260.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Leg. 2</text>\n<circle cx=\"360.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"360.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Leg. 3</text>\n<circle cx=\"460.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"460.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Leg. 4</text>\n<circle cx=\"560.0\" cy=\"110\" r=\"6\" fill=\"#333\"/><text x=\"560.0\" y=\"168\" text-anchor=\"middle\" fill=\"#333\" font-size=\"13\">Leg. 5</text>\n</svg>"}, {"id": "Q1B-070", "lecture": "L5", "stem": "The CARES Act passed in 2020 after years of gridlock because:", "opts": ["the pandemic made the status quo so bad that every pivotal actor preferred the bill to no action", "the House passed it by discharge petition after the committee refused to act", "the filibuster was suspended for the duration of the pandemic emergency", "the president bypassed Congress with an executive order authorizing the spending"], "correct": 0, "expl": "L5 'Multiple pivots and gridlock': all pivotal actors (bicameral majorities, 60-vote cloture pivot, president/veto) must prefer the policy to the status quo."}, {"id": "Q1B-071", "lecture": "L6", "stem": "The observation that more influential candidates (e.g., committee chairs) receive more campaign contributions is most consistent with which motive for contributing?", "opts": ["obtaining services or access from officeholders, as a return on an investment", "reducing the firm's taxable income through deductible political spending", "complying with federal disclosure requirements for corporate political spending", "affecting the outcome of elections in the donor's home state"], "correct": 0, "expl": "L6 'What's the purpose of campaign contributions?': outcome motive vs. services/access motive; more influential candidates should receive more under the access motive."}, {"id": "Q1B-073", "lecture": "L6", "stem": "Under the Federal Election Campaign Act, a corporation:", "opts": ["may not contribute treasury funds directly to federal candidates", "may not participate in federal elections in any form", "may contribute unlimited treasury funds to candidates as long as it discloses them", "may contribute up to $3,500 per election directly from its treasury"], "correct": 0, "expl": "L6 'How to contribute?': FECA bars direct corporate contributions; SSFs (corporate PACs) solicit voluntary contributions."}, {"id": "Q1B-074", "lecture": "L6", "stem": "A corporate PAC may solicit contributions:", "opts": ["from anyone in the general public at any time, subject to the $3,500 limit", "from the corporate treasury, up to $5,000 per candidate per election", "only from shareholders, and only once per year at the annual meeting", "from its restricted class any time, from other employees twice a year, never from the public"], "correct": 3, "expl": "L6 'How to contribute?': restricted class anytime; broader employees twice per year; never the general public."}, {"id": "Q1B-075", "lecture": "L6", "stem": "For the 2025-2026 federal elections, an individual may contribute to a candidate's committee up to:", "opts": ["an unlimited amount, as long as it is disclosed", "$44,300 per year", "$5,000 per election", "$3,500 per election"], "correct": 3, "expl": "L6 'Contribution limits for 2025-2026': individual to candidate $3,500 per election; multicandidate PAC to candidate $5,000 per election; individual to national party $44,300 per year."}, {"id": "Q1B-076", "lecture": "L6", "stem": "Which statement about super PACs is correct?", "opts": ["they may accept unlimited contributions but may not give directly to candidates", "they may contribute up to $5,000 per election directly to candidates", "their spending is capped at $5 million per election cycle", "they are not required to disclose their donors"], "correct": 0, "expl": "L6 'Other ways to donate: super PACs': unlimited money in, donor disclosure required, independent expenditures only."}, {"id": "Q1B-077", "lecture": "L6", "stem": "Compared with a super PAC, a 501(c)(4) social welfare organization:", "opts": ["is not required to disclose its donors", "is regulated primarily by the FEC rather than the IRS", "must disclose its donors and may spend without limit on politics", "may contribute directly to candidates"], "correct": 0, "expl": "L6 'Other ways to donate: 501(c)(4)s': 'dark money'; politics under half of spending; often transfers to an affiliated super PAC."}, {"id": "Q1B-078", "lecture": "L6", "stem": "A hybrid PAC (Carey committee) is best described as:", "opts": ["a corporate PAC that has merged with a trade association's PAC to pool contributions", "one committee with a limited account for candidate gifts and an unlimited account for independent spending", "a super PAC that is permitted to coordinate its spending directly with candidates", "a 501(c)(4) that has registered with the FEC in order to give directly to candidates"], "correct": 1, "expl": "L6 'Other ways to donate: hybrid PACs': named for Carey v. FEC (2011); corporate PACs (SSFs) cannot become hybrids."}, {"id": "Q1B-079", "lecture": "L6", "stem": "Where does a public company's political spending typically appear in its financial statements?", "opts": ["in the statement of cash flows under financing activities", "it is buried in catch-all accounts such as SG&A rather than separately disclosed", "in a mandatory footnote required since the 2011 SEC petition", "as a separate line item on the income statement required by the SEC"], "correct": 1, "expl": "L6 'Where does corporate political spending show up?': immaterial, in SG&A, permanent tax difference; SEC dropped the 2011 petition and appropriations riders block a rule."}, {"id": "Q1B-080", "lecture": "L6", "stem": "In Citizens United v. FEC (2010), the Supreme Court held that:", "opts": ["the FEC may ban political films funded by corporations within 30 days of a primary", "BCRA's limits on corporate-funded electioneering communications violated the First Amendment", "corporations have no First Amendment speech rights in the electoral context", "corporations may contribute directly to federal candidates from their treasuries"], "correct": 1, "expl": "L6 'Citizens United v. FEC (2010)': Kennedy majority; Stevens dissent argued corporate speech should be channeled through PACs."}, {"id": "Q1B-081", "lecture": "L6", "stem": "In NRSC v. FEC (2026), the Supreme Court:", "opts": ["held that super PACs must coordinate with parties", "upheld the coordinated expenditure caps as a safeguard against circumvention", "reinstated the ban on soft money contributions to parties", "struck down the caps on how much parties may spend in coordination with their nominees"], "correct": 3, "expl": "L6 'NRSC v. FEC (2026)': caps ($65,300 for most House races; Senate caps up to $4.07M) violate the First Amendment; parties may now coordinate without limit."}, {"id": "Q1B-083", "lecture": "L7", "stem": "Lobbying is classified as an *informational* strategy because it:", "opts": ["relies on litigation to change policy after a rule has been adopted", "involves contributing money to candidates in exchange for policy favors", "rests on the firm having superior information about the consequences of policy", "mobilizes grassroots constituents to pressure legislators before a vote"], "correct": 2, "expl": "L7 'Lobbying is an informational strategy': provide officeholders information about consequences; examples include testimony and regulatory comment letters."}, {"id": "Q1B-084", "lecture": "L7", "stem": "Lobbying is best defined as:", "opts": ["the exchange of campaign contributions for favorable votes on legislation", "any contact between a firm and a regulator about a pending rule", "the strategic communication of politically relevant information to officeholders", "the organization of a trade association to represent an industry's interests"], "correct": 2, "expl": "L7 'Lobbying as a solution to a problem': politicians face uncertainty and time constraints; lobbying supplies information."}, {"id": "Q1B-085", "lecture": "L7", "stem": "A lobbyist tells a senator that a proposed air-quality rule would reduce nationwide sulfur dioxide emissions by 3 percent. This is an example of:", "opts": ["sequential lobbying", "technical information, about the likely consequences of alternative policies", "political information, about the effects on the officeholder's constituents", "a campaign contribution"], "correct": 1, "expl": "L7 'Two types of lobbying': technical = consequences of policies; political = effects on constituents of officeholders."}, {"id": "Q1B-087", "lecture": "L7", "stem": "Why might a *large* firm choose to lobby indirectly through a trade association rather than directly?", "opts": ["because federal law prohibits large firms from lobbying directly", "because it lacks access to politicians", "to pursue collective goals while avoiding free-riding", "because it cannot afford the fixed costs of a lobbying operation"], "correct": 2, "expl": "L7 'Direct vs indirect': only 10% of public firms lobby directly; small firms cite fixed costs, access, power, intermittent issues; large firms cite proprietary information, different political systems, collective goals."}, {"id": "Q1B-088", "lecture": "L7", "stem": "When a member of Congress retires or is defeated, former staffers who became lobbyists see their revenue fall about 23 percent. This evidence supports the view that lobbyists provide value mainly through:", "opts": ["connections (\"who you know\")", "campaign contributions", "expertise (\"what you know\")", "grassroots mobilization"], "correct": 0, "expl": "L7 'How do lobbyists provide value?': expertise vs. connections; the 23% revenue decline points to connections."}, {"id": "Q1B-089", "lecture": "L7", "stem": "Which legislators should a lobbyist generally **not** target?", "opts": ["those who are strongly opposed to the firm's position", "legislators who already support the position", "bill sponsors and committee chairs", "pivotal legislators"], "correct": 0, "expl": "L7 'Who to target?': powerful legislators, pivotal legislators, existing supporters (counteractive and sequential lobbying); not the strongly opposed."}, {"id": "Q1B-090", "lecture": "L7", "stem": "Under the Lobbying Disclosure Act of 1995 (as amended in 2007), lobbyists must:", "opts": ["limit their campaign contributions to $1,000 per candidate per election cycle", "post transcripts of all their meetings with members of Congress to a public database", "obtain a license from the American Lobbying Association before contacting Congress", "register for each client and file quarterly reports listing the issues and bills worked on"], "correct": 3, "expl": "L7 'Lobbying disclosures': registration thresholds ($3,500 per quarter; $16,000 for in-house), quarterly reports since HLOGA 2007, semiannual contribution reports."}, {"id": "Q1B-092", "lecture": "L8", "stem": "Which of the following best describes regulation?", "opts": ["voluntary standards that an industry adopts to preempt government action", "government intervention in economic activity using commands, controls, and incentives", "any law passed by Congress and signed by the president", "court decisions that interpret statutes and set legal precedent"], "correct": 1, "expl": "L8 'What is regulation?': both a political and an economic instrument; often industry specific."}, {"id": "Q1B-093", "lecture": "L8", "stem": "The first federal regulatory agency in the United States was the:", "opts": ["Interstate Commerce Commission (1887)", "Federal Trade Commission (1914)", "Securities and Exchange Commission (1934)", "Environmental Protection Agency (1970)"], "correct": 0, "expl": "L8 'Regulation in the Constitution': Article I, Section 8 commerce power; ICC created in 1887."}, {"id": "Q1B-094", "lecture": "L8", "stem": "Under the Administrative Procedure Act of 1946, *informal* rulemaking requires an agency to:", "opts": ["obtain approval from both houses of Congress", "publish a draft rule and solicit comments from interested parties before adopting it", "obtain a court order authorizing the rule", "hold a trial-like hearing with witness testimony before an administrative law judge"], "correct": 1, "expl": "L8 'The rulemaking process': APA ensures notice and comment; formal process resembles a judicial proceeding; informal process = draft rule plus comments."}, {"id": "Q1B-095", "lecture": "L8", "stem": "A new factory opens in a region, increasing demand for labor and raising wages paid by other local employers. This is an example of:", "opts": ["moral hazard", "a nonpecuniary externality", "a public good", "a pecuniary externality"], "correct": 3, "expl": "L8 'Types of Externalities': pecuniary externalities operate through prices; nonpecuniary externalities directly affect preferences or production opportunities."}, {"id": "Q1B-096", "lecture": "L8", "stem": "Public goods are defined by being:", "opts": ["goods with decreasing average costs", "rivalrous and excludable, which is why markets price them efficiently", "produced only by government, which is why they are funded through taxes", "non-rivalrous and non-excludable, which is why markets tend to undersupply them"], "correct": 3, "expl": "L8 'Public Goods': one person's consumption does not reduce availability; impractical to exclude non-payers; market undersupplies."}, {"id": "Q1B-097", "lecture": "L8", "stem": "The Securities Act of 1933 and Securities Exchange Act of 1934 mandated corporate disclosure primarily to address which market imperfection?", "opts": ["moral hazard", "asymmetric information", "natural monopoly", "pecuniary externalities"], "correct": 1, "expl": "L8 'Asymmetric Information' and 'History of the SEC': disclosure mandates resolve information asymmetries after the 1929 crash eroded trust."}, {"id": "Q1B-098", "lecture": "L8", "stem": "In the 19th century, railroads sought federal regulation to support their cartel agreements. This is an example of:", "opts": ["the median voter theorem", "rent-seeking: regulation established to benefit politically effective interests", "regulatory capture: regulation that evolves over time to serve the regulated industry", "correction of a natural monopoly"], "correct": 1, "expl": "L8 'Political theories of regulation': rent-seeking (railroads) vs. regulatory capture (regulation starts at a market imperfection and evolves to serve the industry)."}, {"id": "Q1B-099", "lecture": "L8", "stem": "Political theories of regulation predict that:", "opts": ["regulators are immune to influence from regulated firms", "regulation is instituted only to correct market imperfections", "interest groups seek regulation to serve their own interests", "regulation always maximizes consumer welfare"], "correct": 2, "expl": "L8 'Why do we have regulation?': market imperfection theories vs. political theories."}, {"id": "Q1B-100", "lecture": "L8", "stem": "Federally subsidized flood insurance encourages homeowners to build in high-flood-risk areas. This is an example of:", "opts": ["a natural monopoly", "adverse selection", "a public good", "moral hazard"], "correct": 3, "expl": "L8 'Moral Hazard': flood insurance example; remedies include restructuring incentives and monitoring."}, {"id": "Q1B-101", "lecture": "L2", "stem": "Which of the following is not part of the 4Is of the nonmarket environment?", "opts": ["Interests", "Ideas", "Institutions", "Information"], "correct": 1, "expl": "Prior Quiz1 Q1. L2 \"The four Is\"."}, {"id": "Q1B-102", "lecture": "L2", "stem": "Which of the following best explains the concept of interests in the nonmarket environment?", "opts": ["Interests are the political processes that shape corporate strategies.", "Interests are the individuals and groups with a stake or preference regarding an issue.", "Interests are the legal institutions that influence nonmarket outcomes.", "Interests are the media outlets that report on nonmarket issues."], "correct": 1, "expl": "Prior Quiz1 Q2. L2 \"Interests\"."}, {"id": "Q1B-103", "lecture": "L2", "stem": "What is an example of an interest with strong incentives to organize?", "opts": ["The general public", "Consumers", "Labor unions", "Tax payers"], "correct": 2, "expl": "Prior Quiz1 Q3. L2 \"Organized vs unorganized interests\"."}, {"id": "Q1B-104", "lecture": "L2", "stem": "Which of the following lists the stages of the nonmarket issue life cycle in the correct order, from first to last?", "opts": ["Issue identification, interest group formation, legislation, administration, enforcement", "Issue identification, legislation, interest group formation, enforcement, administration", "Interest group formation, issue identification, legislation, administration, enforcement", "Legislation, administration, enforcement, issue identification, interest group formation"], "correct": 0, "expl": "Prior Quiz1 Q4, originally a 1-5 ordering item; converted to multiple choice. Its duplicate (formerly Q1B-023) was removed 2026-09-18. L2 \"Issue life cycle\"."}, {"id": "Q1B-105", "lecture": "L2", "stem": "Which of the following statements about the nonmarket issue life cycle is correct?", "opts": ["The life cycle always begins with legislation.", "Not every nonmarket issue passes through all five stages of the life cycle.", "Enforcement always precedes administration.", "An issue cannot re-emerge once it has reached the enforcement stage."], "correct": 1, "expl": "Prior Quiz1 Q5, originally true/false (\"All nonmarket issues must pass through all five stages\" = False); converted to multiple choice. L2 \"Issue life cycle\"."}, {"id": "Q1B-106", "lecture": "L3", "stem": "Which of the following best describes the function of committees in the U.S. House of Representatives?", "opts": ["Committees are responsible for reviewing and amending bills before they are considered on the floor.", "Committees primarily focus on enforcing laws passed by Congress.", "Committees directly vote on final legislation without input from the entire House.", "Committees are appointed by the president to advise on legislative matters."], "correct": 0, "expl": "Prior Quiz1 Q6. L3 \"Committees and gatekeeping authority in the House\"."}, {"id": "Q1B-107", "lecture": "L5", "stem": "In vote recruiting strategies, a pivotal legislator is one who:", "opts": ["Opposes the proposal regardless of the persuasive efforts of the proposal’s supporters", "Will be decisive in determining whether the proposal passes or fails", "Has an ideal policy that is located at the median of all legislators", "Has the most liberal ideal policy of all legislators"], "correct": 1, "expl": "Prior Quiz2 Q1. L5 \"Majority-building strategies\"."}, {"id": "Q1B-108", "lecture": "L4", "stem": "Which of the following is true for the news media when treating issues?", "opts": ["It need not take into account the potential ramification of covering the issue.", "It never takes a biased stand in its assessment of the issue.", "It should not interpret facts and events of the issue.", "It can advocate a course of action for the issue."], "correct": 3, "expl": "Prior Quiz2 Q2. L4 \"Issues and media coverage\"."}, {"id": "Q1B-109", "lecture": "L5", "stem": "Which of the following best describes client politics?", "opts": ["benefits of policy are widely distributed", "alternative is favored over the status quo", "harm from policy is concentrated", "status quo is favored over the alternative"], "correct": 1, "expl": "Client politics: concentrated benefits, distributed costs; organized beneficiaries favor the alternative. L5 \"Client politics\"."}, {"id": "Q1B-110", "lecture": "L5", "stem": "A local government is debating a new zoning law that would impose strict limits on the height of new buildings in residential neighborhoods. Homeowners, organized through a well-funded neighborhood association, support the regulation because it protects their property values, while real estate developers oppose it because it limits their ability to maximize profits on new developments. Which type of political competition does this situation represent according to the Wilson-Lowi Matrix?", "opts": ["Interest Group Politics", "Client Politics", "Entrepreneurial Politics", "Majoritarian Politics"], "correct": 0, "expl": "Prior Quiz2 Q4. Both sides identifiable and organized (homeowners vs developers). L5 \"Interest group politics\"."}, {"id": "Q1B-111", "lecture": "L5", "stem": "Which of the following is not a potential explanation for ideological divergence among candidates?", "opts": ["Candidates care more about ideology than winning office.", "Campaign contributions and primaries encourage candidates to adopt non-median positions.", "The median voter theorem only applies in single-member districts.", "Moderate voters abstain from voting."], "correct": 2, "expl": "Prior Quiz2 Q5. L5 \"Explanations for ideological divergence\"."}, {"id": "Q1B-112", "lecture": "L5", "stem": "According to the median voter theorem, where should a candidate position themselves ideologically in a two-candidate election to maximize their vote share?", "opts": ["As far from the median voter as possible to maintain ideological purity", "At a position equidistant from both their party’s base and the median voter", "At the extreme left or right, depending on the candidate's party", "Close to the ideological position of the median voter"], "correct": 3, "expl": "Prior Quiz2 Q6. L5 \"Median voter theorem in elections\"."}, {"id": "Q1B-113", "lecture": "L6", "stem": "Under U.S. campaign finance law,", "opts": ["individual campaign contributions to candidates are tax deductible", "individuals are allowed to contribute unlimited amounts of money to candidates", "it is illegal for individuals to contribute more than a certain amount of money to candidates", "individual contributions to candidates are matched dollar for dollar by the federal political candidate trust fund"], "correct": 2, "expl": "Prior Quiz3 Q1. L6 \"Contribution limits\" ($3,500 per election for 2025-26)."}, {"id": "Q1B-114", "lecture": "L6", "stem": "Under U.S. campaign finance law candidates are", "opts": ["Ineligible to receive contributions from Political Action Committees", "Not allowed to spend more than $10 million on television advertisements supporting their candidacies", "Permitted to make unlimited contributions to their own campaigns", "Permitted to make unlimited contributions to the campaigns of other candidates for federal office"], "correct": 2, "expl": "Prior Quiz3 Q2. Candidate self-funding is unlimited (Buckley v. Valeo); not on the FA26 slides, verify before use."}, {"id": "Q1B-115", "lecture": "L7", "stem": "Registered lobbyists who meet with members of Congress are required to", "opts": ["make campaign contributions to the Speaker of the House", "hold law degrees and be professionally certified by the American Lobbying Association", "record all of their meetings with members of Congress and post transcripts of their conversations to a public database", "file quarterly reports disclosing the issues and bills on which they lobby"], "correct": 3, "expl": "Prior Quiz3 Q3 (typo fixed). L7 \"Lobbying disclosures\"."}, {"id": "Q1B-116", "lecture": "L7", "stem": "Which of the following would be an example of a lobbyist providing political information to a member of Congress?", "opts": ["stating that a tax proposal would increase the federal deficit by $4.2 billion in 2030", "stating that a tax proposal would result in an increase in 12,000 jobs in the member's Congressional district", "stating that a new air pollution standard would result in a 3 percent nationwide reduction in sulfur dioxide emissions", "stating that an education policy would increase average student standardized test scores by 8 percent"], "correct": 1, "expl": "Prior Quiz3 Q4 (typo fixed). Political information concerns effects on the officeholder’s constituents. Companion to Q1B-089 (technical). L7 \"Two types of lobbying\"."}, {"id": "Q1B-117", "lecture": "L6", "stem": "Campaign contributions are made to", "opts": ["affect the outcome of elections by helping preferred candidates win", "obtain desirable services or policies from officeholders", "secure access to meetings with present or future officeholders", "all of the above motivate campaign contributions"], "correct": 3, "expl": "Prior Quiz3 Q5 (typo fixed). L6 \"What’s the purpose of campaign contributions?\"."}, {"id": "Q1B-118", "lecture": "L7", "stem": "Sequential lobbying refers to", "opts": ["Lobbying that is coordinated across companies within the same industry to share costs", "A lobbying approach that focuses on influencing public opinion before approaching lawmakers", "Lobbying that occurs only during election years, when lawmakers are most attentive to donors", "Informational lobbying of lawmakers who already support a proposal so they can persuade colleagues"], "correct": 3, "expl": "Prior Quiz3 Q6. L7 \"Who to target?\" (counteractive and sequential lobbying)."}, {"id": "Q1B-119", "lecture": "L8", "stem": "Which of the following is **not** a market imperfection that motivates government regulation of business?", "opts": ["natural monopoly", "redistribution", "asymmetric information", "externalities"], "correct": 1, "expl": "Prior Quiz4p1 Q1 (grammar fixed). L8 \"What are market imperfections?\"."}, {"id": "Q1B-120", "lecture": "L8", "stem": "The theory of regulatory capture argues that government regulation", "opts": ["of the recapture market in insurance is justified by natural monopoly", "benefits incumbent firms instead of society as a whole because regulators are captured by incumbent firms", "allows society to capture as much consumer surplus as possible", "is most effective when regulators have previously served as members of Congress"], "correct": 1, "expl": "Prior Quiz4p1 Q2 (typos fixed). L8 \"Political theories of regulation\"."}, {"id": "Q1B-124", "lecture": "L8", "stem": "What does the term \"moral hazard\" refer to in the context of regulation?", "opts": ["The risk that regulations will unfairly punish successful companies for their market share", "The benefits of reducing regulations to increase market efficiency and lower compliance costs", "The inefficient actions that arise when people do not bear the full consequences of their actions", "The positive outcomes of regulation in reducing market imperfections such as externalities"], "correct": 2, "expl": "Prior Quiz4p1 Q6. L8 \"Moral Hazard\"."}, {"id": "Q1B-141", "lecture": "L3", "stem": "Which statement about the structure of the U.S. Supreme Court is correct?", "opts": ["it currently has thirteen members, one from each of the federal appeals circuits", "its members are elected to staggered ten-year terms by voters nationwide", "it currently has nine members and sits above the federal appeals and district courts", "it is part of the executive branch, and its members serve at the president's pleasure"], "correct": 2, "expl": "L3 'Judicial': the federal judiciary is organized into the Supreme Court, Appeals Courts, and District Courts; the Supreme Court currently has nine members; judges are unelected with lifetime appointments."}, {"id": "Q1B-142", "lecture": "L3", "stem": "The number of justices on the U.S. Supreme Court is set by:", "opts": ["the Constitution, in Article III", "the president, by executive order", "Congress, through ordinary legislation", "the Court itself, under its own rules"], "correct": 2, "expl": "L3 'Judicial': the Constitution does not fix the Court's size; Congress sets it by statute, and it has been nine since the Judiciary Act of 1869."}, {"id": "Q1B-143", "lecture": "L3", "stem": "Discharge petitions are difficult to complete, yet they have been used increasingly in the 119th Congress. Which of the following best explains why?", "opts": ["the majority party's margin is so narrow that a few of its members plus the minority reach 218", "a recent rules change lowered the number of signatures required", "the Speaker now uses discharge petitions to move the majority party's priority bills faster", "signatures are now kept secret, so members can sign without their party leaders knowing"], "correct": 0, "expl": "L3/L4 'Committees and gatekeeping authority in the House': a discharge petition needs a majority (218); it is increasingly used (examples: EFTA II, ACA subsidy extension) because, with a very narrow majority, a handful of majority-party members joining the minority can force a floor vote on a bill the leadership will not schedule. The threshold is still 218, signatures are public, and petitions work around the leadership rather than for it."}, {"id": "Q1B-133", "lecture": "L4", "stem": "The \"intrinsic audience interest\" factor in media coverage holds that audiences are generally more interested in issues that:", "opts": ["are close to their own experience, geographically or conceptually", "the media has a self-defined duty to cover for the public's benefit", "are complex and require extended interpretation by journalists", "align with the ideological or financial interests of media owners"], "correct": 0, "expl": "L4 'Factors affecting media coverage': intrinsic audience interest = issues close to the audience's own experience (geographical and conceptual); the duty to inform is societal significance."}, {"id": "Q1B-134", "lecture": "L4", "stem": "The news media can influence elections by changing people's views and by:", "opts": ["contributing directly to candidates' campaign committees", "certifying vote counts before results are announced", "deciding which candidates qualify for the ballot", "increasing awareness of, and turnout in, elections"], "correct": 3, "expl": "L4 'Media and electoral influence': two channels, changing people's views and increasing awareness of/turnout in elections."}, {"id": "Q1B-135", "lecture": "L4", "stem": "A news aggregator such as Google News acts as a *complement* to news outlets, rather than a substitute, when it:", "opts": ["lets readers skim headlines without clicking through to outlets' sites", "produces original reporting that competes with outlets' own stories", "lowers readers' costs of searching for and discovering outlets' stories", "charges outlets a fee for each story snippet that it links to"], "correct": 2, "expl": "L4 'News aggregators in the media market': substitute by reducing the need to click through; complement by reducing search and discovery costs. Aggregators produce no original content."}, {"id": "Q1B-136", "lecture": "L7", "stem": "Which of the following is a reason *smaller* firms lobby through trade associations rather than directly?", "opts": ["federal law bars firms below a size threshold from lobbying directly", "trade associations are exempt from lobbying disclosure requirements", "the issues that affect them arise continuously rather than intermittently", "they have fewer resources to cover the fixed costs of lobbying"], "correct": 3, "expl": "L7 'Direct vs indirect': smaller firms have fewer resources for the fixed costs of a lobbying organization, less access, insufficient political power, and issues that arise only intermittently."}, {"id": "Q1B-137", "lecture": "L7", "stem": "A lobbying firm specializes in healthcare policy. Because of its issue knowledge, its lobbyists get meetings even with legislators from the opposite party. This best illustrates lobbyists providing value through:", "opts": ["connections (\"who you know\")", "grassroots mobilization", "expertise (\"what you know\")", "campaign contributions"], "correct": 2, "expl": "L7 'How do lobbyists provide value?': expertise vs. connections; lobbyists who specialize in particular issues are more likely to access politicians of the opposite party."}, {"id": "Q1B-138", "lecture": "L7", "stem": "Besides lobbying, which of the following is an informational strategy?", "opts": ["contributing to a candidate through the firm's PAC", "funding a super PAC's independent expenditures", "testifying before a congressional committee", "hosting a fundraiser for a committee chair"], "correct": 2, "expl": "L7 'Lobbying is an informational strategy': examples are lobbying, testimony, and regulatory information flow (SEC comment letters). The other options are campaign finance tools (L6)."}, {"id": "Q1B-139", "lecture": "L8", "stem": "A natural monopoly arises when:", "opts": ["one firm can produce a set of goods at lower cost than any larger number of firms", "a firm acquires its rivals until it is the only seller left in the market", "the government grants one firm an exclusive license to serve a market", "a firm's costs rise with its scale of output, which keeps new entrants out"], "correct": 0, "expl": "L8 'Natural Monopolies': one firm can produce a given set of goods at lower cost than any larger number of firms; costs are decreasing (not rising) in scale or scope."}, {"id": "Q1B-140", "lecture": "L8", "stem": "When sellers know more about product quality than buyers do, a market can suffer from adverse selection, in which:", "opts": ["only low-quality types end up participating in the market", "insured parties take more risks because they do not bear the full costs", "one firm's actions change the prices that other firms must pay", "consumers cannot be excluded from using a good they did not pay for"], "correct": 0, "expl": "L8 'Asymmetric Information': adverse selection = only \"low quality\" types participate (Akerlof 1970, market for lemons). B describes moral hazard, C a pecuniary externality, D non-excludability."}];
const LNAME = Object.fromEntries([["L1", "Course overview"], ["L2", "The 4Is"], ["L3", "Government primer"], ["L4", "Media"], ["L5", "Legislative strategy"], ["L6", "Campaign finance"], ["L7", "Lobbying"], ["L8", "Regulation"], ["SS1", "Stepping Stone 1"], ["L9", "Antitrust"], ["L10", "Intellectual property"], ["Case-Uber", "Uber case"], ["Case-Amazon", "Amazon case"], ["Guest", "Guest lecture"]]);
const $ = s => document.querySelector(s);
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* answers this viewer has given: id -> {pick (option text), ok} */
let answers = {};
try { answers = JSON.parse(lsGet('answers') || '{}') || {}; } catch(e){ answers = {}; }

/* shuffled deck: order of ids + per-question option order (fresh each load) */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let deck = [];
function build(){
  deck = shuffle(Q.map(q => {
    const idx = shuffle([0,1,2,3]);
    return { q, order: idx };
  }));
}
build();
let lec = lsGet('f-lecture') || '';
let view = [], idx = 0;

const fl = $('#f-lecture');
[...new Set(Q.map(q => q.lecture))].sort((a,b) => Object.keys(LNAME).indexOf(a) - Object.keys(LNAME).indexOf(b))
  .forEach(k => { const o=document.createElement('option'); o.value=k; o.textContent=(k.startsWith('L')?k+' · ':'')+(LNAME[k]||k); fl.appendChild(o); });
fl.value = lec;
fl.addEventListener('change', () => { lec = fl.value; lsSet('f-lecture', lec); idx = 0; applyFilter(); });
$('#reshuffle').addEventListener('click', () => { build(); idx = 0; applyFilter(); });
$('#reset').addEventListener('click', () => { answers = {}; lsDel('answers'); render(); });

function applyFilter(){ view = deck.filter(d => !lec || d.q.lecture===lec); idx = Math.min(idx, Math.max(0, view.length-1)); render(); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }
function renderScore(){
  const ids = view.map(d => d.q.id);
  const done = ids.filter(i => answers[i]).length, ok = ids.filter(i => answers[i] && answers[i].ok).length;
  $('#score').innerHTML = `<span>Answered <b>${done}</b> of <b>${ids.length}</b></span><span>Correct <b>${ok}</b>${done ? ` (${Math.round(100*ok/done)}%)` : ''}</span>`;
  $('#bar').style.width = ids.length ? (100*done/ids.length)+'%' : '0';
}
function render(){
  renderScore();
  const card = $('#card'), n = view.length;
  $('#pos').textContent = n ? `${idx+1} of ${n}` : '0 of 0';
  $('#prev').disabled = idx<=0; $('#next').disabled = idx>=n-1;
  if (!n){ card.innerHTML = '<div class="empty">No questions in this lecture.</div>'; return; }
  const {q, order} = view[idx];
  const a = answers[q.id];
  card.innerHTML = `
    <div class="eyebrow"><span class="chip">${esc((q.lecture.startsWith('L')?q.lecture+' · ':'')+(LNAME[q.lecture]||q.lecture))}</span></div>
    <p class="stem">${fmt(q.stem)}</p>
    ${q.svg ? `<div class="fig">${q.svg}</div>` : ''}
    <ul class="opts">${order.map((oi,k) => {
      const text = q.opts[oi];
      let cls = '';
      if (a){ if (oi===q.correct) cls='correct'; else if (a.pick===text) cls='wrong'; }
      return `<li><button type="button" data-k="${k}" class="${cls}" ${a?'disabled':''}><span class="l">${'abcd'[k]}.</span><span class="t">${fmt(text)}</span></button></li>`;
    }).join('')}</ul>
    ${a ? `<div class="verdict ${a.ok?'ok':'no'}">${a.ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.'}</div><p class="expl">${esc(q.expl)}</p>` : ''}`;
  card.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => answer(parseInt(b.dataset.k,10))));
}
function answer(k){
  const {q, order} = view[idx];
  if (answers[q.id]) return;
  const oi = order[k];
  answers[q.id] = { pick: q.opts[oi], ok: oi===q.correct };
  lsSet('answers', JSON.stringify(answers));
  render();
}
function go(i){ if (i<0 || i>=view.length) return; idx=i; render(); window.scrollTo({top:0}); }
$('#prev').addEventListener('click', () => go(idx-1));
$('#next').addEventListener('click', () => go(idx+1));
document.addEventListener('keydown', e => {
  const tag=(e.target.tagName||'').toLowerCase(); if (tag==='select' || tag==='input' || tag==='textarea') return;
  if (e.key==='ArrowRight') go(idx+1);
  else if (e.key==='ArrowLeft') go(idx-1);
  else if (e.key==='Enter'){ const j = view.findIndex((d,i) => i>idx && !answers[d.q.id]); if (j>=0) go(j); }
  else if ('1234'.includes(e.key) && e.key) answer(parseInt(e.key,10)-1);
  else if ('abcd'.includes(e.key.toLowerCase()) && e.key.length===1) answer('abcd'.indexOf(e.key.toLowerCase()));
});
applyFilter();
</script>
</body>
</html>
